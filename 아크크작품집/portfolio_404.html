<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>존재하지 않는 작품집 · 아하오호</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --brand-black: #0B1215;
    --brand-neon: #edff4b;
    --bg: #FDFCF8;
    --text-main: #1a1a1a;
    --text-sub: #666;
  }

  body {
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-main);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .header {
    background: #010007;
    display: flex;
    align-items: center;
    padding: 24px 64px;
    position: relative;
    overflow: hidden;
  }

  .header-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  .header-glow {
    position: absolute;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    width: 320px; height: 320px;
    background: radial-gradient(circle, rgba(26,60,255,0.15) 0%, transparent 65%);
    right: -60px; top: -120px;
  }

  .header-badge {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 12px;
    position: relative;
    z-index: 2;
  }

  .header-wordmark {
    font-family: 'Pretendard', sans-serif;
    font-size: 20px;
    font-weight: 800;
    color: #ffffff;
    letter-spacing: -0.01em;
    white-space: nowrap;
    line-height: 1;
  }
  .header-wordmark em {
    font-style: normal;
    color: var(--brand-neon);
  }

  /* 404 CONTENT */
  .error-section {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 24px;
    gap: 0;
    text-align: center;
  }

  /* 로티 + 텍스트가 한 묶음으로 섹션 중앙에 정렬된다 */
  .error-visual {
    position: relative;
    width: 200px;
    height: 200px;
    margin: 0 auto -16px;
  }

  .error-lottie {
    position: relative;
    display: block;
    width: 100%;
    height: 100%;
    z-index: 1;
  }

  .error-title {
    font-size: 24px;
    font-weight: 500;
    line-height: 1.35;
    color: var(--text-main);
  }

  .error-desc {
    margin-top: 12px;
    font-size: 16px;
    font-weight: 400;
    line-height: 1.8;
    color: var(--text-sub);
  }

  @media (max-width: 700px) {
    .header { padding: 20px 32px; }
  }

  /* ─── APP STORE CTA (작품집 화면과 동일) ─── */
  .app-cta {
    background: var(--brand-black);
    padding: 48px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }
  .app-cta-text {
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
    letter-spacing: -0.01em;
  }
  .app-cta-eyebrow {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.01em;
    margin-bottom: 6px;
  }
  .app-cta-text em {
    display: block;
    color: #ffffff;
    font-style: normal;
    font-size: 24px;
    font-weight: 600;
  }
  .app-cta-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .app-store-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.1);
    border: 1.5px solid rgba(255,255,255,0.2);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 12px 22px;
    border-radius: 10px;
    text-decoration: none;
    transition: background 0.15s, border-color 0.15s;
  }
  .app-store-btn:hover {
    background: rgba(255,255,255,0.18);
    border-color: rgba(255,255,255,0.4);
  }
  .app-store-btn svg { flex-shrink: 0; }
</style>
<script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.7.2/dist/dotlottie-wc.js" type="module"></script>
